<svg xmlns="http://www.w3.org/2000/svg" width="140" height="24" viewBox="0 0 140 24" role="img" aria-label="Powered by Garno">
  <title>Powered by Garno</title>
  <style>
    .by { fill: #a3a9b1; }
    .name { fill: #f1efe9; font-weight: 700; }
    text { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.01em; }
    @media (prefers-reduced-motion: no-preference) {
      .arrow { animation: shoot 700ms cubic-bezier(.2,.8,.2,1) 200ms both; }
      .ring { stroke-dasharray: 960; animation: draw 650ms cubic-bezier(.65,0,.25,1) 450ms both; }
      text { animation: fade 500ms cubic-bezier(.2,.8,.2,1) 550ms both; }
    }
    @keyframes shoot { 0% { transform: translateX(-340px); opacity: 0 } 30% { opacity: 1 } 80% { transform: translateX(24px) } 100% { transform: none } }
    @keyframes draw { from { stroke-dashoffset: 960 } to { stroke-dashoffset: 0 } }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  </style>
  <svg x="0" y="1" width="24" height="22" viewBox="176 146 432 408" overflow="visible">
    <defs>
      <mask id="knock" maskUnits="userSpaceOnUse" x="176" y="146" width="432" height="408">
        <rect x="176" y="146" width="432" height="408" fill="#fff"/>
        <polygon points="190,327 408,327 365,270 433,270 498,352 433,434 365,434 408,382 190,382" fill="#000" stroke="#000" stroke-width="36" stroke-linejoin="round"/>
      </mask>
    </defs>
    <g mask="url(#knock)">
      <path class="ring" d="M550 350 A160 160 0 1 1 535 282.4" fill="none" stroke="#ffffff" stroke-width="78"/>
      <rect x="506" y="326" width="90" height="72" fill="#ffffff"/>
    </g>
    <polygon class="arrow" points="190,327 408,327 365,270 433,270 498,352 433,434 365,434 408,382 190,382" fill="#fdb813"/>
  </svg>
  <text x="31" y="16.2"><tspan class="by">Powered by</tspan> <tspan class="name">Garno</tspan></text>
</svg>
